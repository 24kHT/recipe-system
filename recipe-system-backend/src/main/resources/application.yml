server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: recipe-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:recipe_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:201214}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

recipe:
  jwt-secret: ${JWT_SECRET:recipe-system-springboot-secret-key-please-change}
  jwt-expire-hours: 168

springdoc:
  swagger-ui:
    path: /swagger-ui.html
